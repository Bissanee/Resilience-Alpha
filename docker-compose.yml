# Resilience-Alpha - orchestration locale du demonstrateur
# Demarrage : copier .env.example vers .env, adapter les valeurs, puis executer :
# docker compose up -d --build
name: resilience-alpha

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-runtime-guardrails: &runtime-guardrails
  mem_limit: 512m
  cpus: "1.0"
  pids_limit: 200
  security_opt: ["no-new-privileges:true"]

x-app-base: &app-base
  <<: *runtime-guardrails
  read_only: true
  cap_drop: [ALL]
  tmpfs: ["/tmp:size=64m,mode=1777"]
  logging: *logging
  restart: unless-stopped

networks:
  # Seuls les services possedant un port publie rejoignent ce reseau.
  edge-net:
  app-net:
    internal: true
  remediation-docker-net:
    internal: true
  observability-docker-net:
    internal: true
  observability-net:
    internal: true
  data-net:
    internal: true
  ai-net:
    internal: true

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
  ollama-data:
  waf-deny:

services:
  waf:
    <<: *runtime-guardrails
    image: owasp/modsecurity-crs:nginx-alpine
    environment:
      BACKEND: http://front:3000
      PORT: "8080"
      MODSEC_RULE_ENGINE: "On"
      PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      ACCESSLOG: /dev/stdout
      ERRORLOG: /dev/stderr
      AUDITLOG: /dev/stdout
      LOGLEVEL: warn
      SERVER_TOKENS: "off"
      SERVER_HEADER: ""
    ports: ["80:8080"]
    volumes:
      - ./infra/waf/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./infra/waf/logging.conf.template:/etc/nginx/templates/conf.d/logging.conf.template:ro
      - ./infra/waf/security-zones.conf.template:/etc/nginx/templates/conf.d/security-zones.conf.template:ro
      - ./infra/waf/proxy-common.conf.template:/etc/nginx/templates/includes/proxy-common.conf.template:ro
      - ./infra/waf/deny/blocked-ips.conf:/etc/waf-deny/blocked-ips.conf:ro
    depends_on:
      front: { condition: service_healthy }
      auth: { condition: service_healthy }
      api-paiement: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Host: localhost' http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging
    restart: unless-stopped
    networks: [edge-net, app-net]

  front:
    <<: *app-base
    build: ./services/front
    environment:
      SERVICE: front
      PORT: "3000"
      AUTH_URL: http://auth:4001
      API_URL: http://api-paiement:4000
    depends_on:
      auth: { condition: service_healthy }
      api-paiement: { condition: service_healthy }
    networks: [app-net, observability-net]

  auth:
    <<: *app-base
    build: ./services/auth
    environment:
      SERVICE: auth
      PORT: "4001"
      JWT_SECRET: ${JWT_SECRET:?definir JWT_SECRET dans .env}
      USER_PASSWORD: ${USER_PASSWORD:?definir USER_PASSWORD dans .env}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:?definir MONITOR_PASSWORD dans .env}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?definir POSTGRES_DB dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?definir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD dans .env}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [app-net, data-net, observability-net]

  api-paiement:
    <<: *app-base
    build: ./services/api-paiement
    environment:
      SERVICE: api-paiement
      PORT: "4000"
      AUTH_URL: http://auth:4001
      JWT_SECRET: ${JWT_SECRET:?definir JWT_SECRET dans .env}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?definir POSTGRES_DB dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?definir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD dans .env}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [app-net, data-net, observability-net]

  postgres:
    <<: *runtime-guardrails
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?definir POSTGRES_DB dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?definir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    restart: unless-stopped
    networks: [data-net, observability-net]

  remediation:
    <<: *app-base
    build: ./services/remediation
    environment:
      SERVICE: remediation
      PORT: "5000"
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      COMPOSE_PROJECT_NAME: resilience-alpha
      ALLOWED_SERVICES: api-paiement,auth,front
      API_URL: http://api-paiement:4000
      AUTH_URL: http://auth:4001
      WAF_DENY_FILE: /etc/waf-deny/blocked-ips.conf
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:?definir MONITOR_PASSWORD dans .env}
      REMEDIATION_TOKEN: ${REMEDIATION_TOKEN:-}
    volumes:
      - ./infra/waf/deny:/etc/waf-deny:rw
    depends_on:
      docker-socket-proxy: { condition: service_started }
    networks: [app-net, remediation-docker-net, observability-net]

  dashboard:
    <<: *app-base
    build: ./services/dashboard
    environment:
      SERVICE: dashboard
      PORT: "8088"
      REMEDIATION_URL: http://remediation:5000
      API_URL: http://api-paiement:4000
      AUTH_URL: http://auth:4001
      FRONT_URL: http://front:3000
      DETECTOR_URL: http://detector:5100
      GRAFANA_URL: http://127.0.0.1:3001
    ports: ["127.0.0.1:8088:8088"]
    depends_on:
      remediation: { condition: service_healthy }
      api-paiement: { condition: service_healthy }
      auth: { condition: service_healthy }
      front: { condition: service_healthy }
      detector: { condition: service_started }
    networks: [edge-net, app-net, observability-net]

  detector:
    <<: *app-base
    build: ./services/detector
    environment:
      SERVICE: detector
      PORT: "5100"
      PROMETHEUS_URL: http://prometheus:9090
      REMEDIATION_URL: http://remediation:5000
      REMEDIATION_TOKEN: ${REMEDIATION_TOKEN:-}
      LOKI_URL: http://loki:3100
      DETECTOR_INTERVAL_SECONDS: ${DETECTOR_INTERVAL_SECONDS:-10}
      MIN_TRAINING_SAMPLES: ${MIN_TRAINING_SAMPLES:-30}
      DETECTOR_ALERT_THRESHOLD: ${DETECTOR_ALERT_THRESHOLD:-0.78}
      DETECTOR_ALERT_COOLDOWN_SECONDS: ${DETECTOR_ALERT_COOLDOWN_SECONDS:-120}
    depends_on:
      prometheus: { condition: service_healthy }
    networks: [app-net, observability-net]

  rag:
    <<: *app-base
    build: ./services/rag
    environment:
      SERVICE: rag
      PORT: "5200"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      RAG_DOCS_DIR: /docs
      RAG_TOP_K: ${RAG_TOP_K:-4}
    volumes:
      - ./docs:/docs:ro
    networks: [ai-net, observability-net]

  ollama:
    <<: *runtime-guardrails
    image: ollama/ollama:0.12.3
    profiles: ["llm"]
    mem_limit: 4g
    cpus: "4.0"
    pids_limit: 512
    volumes:
      - ollama-data:/root/.ollama
    logging: *logging
    restart: unless-stopped
    networks: [ai-net]

  prometheus:
    <<: *runtime-guardrails
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging
    restart: unless-stopped
    networks: [observability-net]

  grafana:
    <<: *runtime-guardrails
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?definir GRAFANA_ADMIN_PASSWORD dans .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["127.0.0.1:3001:3000"]
    depends_on:
      prometheus: { condition: service_healthy }
      loki: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    logging: *logging
    restart: unless-stopped
    networks: [edge-net, observability-net]

  loki:
    <<: *runtime-guardrails
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    logging: *logging
    restart: unless-stopped
    networks: [observability-net]

  alloy:
    <<: *runtime-guardrails
    image: grafana/alloy:v1.20.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki: { condition: service_healthy }
      docker-proxy-ro: { condition: service_started }
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    restart: unless-stopped
    networks: [observability-net, observability-docker-net]

  cadvisor:
    <<: *runtime-guardrails
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    restart: unless-stopped
    networks: [observability-net]

  docker-socket-proxy:
    <<: *runtime-guardrails
    image: tecnativa/docker-socket-proxy:0.3.0
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 50
    environment:
      CONTAINERS: "1"
      ALLOW_RESTARTS: "1"
      POST: "1"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs: [/run, /tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    restart: unless-stopped
    networks: [remediation-docker-net]

  docker-proxy-ro:
    <<: *runtime-guardrails
    image: tecnativa/docker-socket-proxy:0.3.0
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 50
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      NETWORKS: "1"
      POST: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs: [/run, /tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    restart: unless-stopped
    networks: [observability-docker-net]
