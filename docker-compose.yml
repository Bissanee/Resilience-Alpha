# Resilience-Alpha : squelette de la plateforme
# Démarrage : cp .env.example .env && ./scripts/init-stubs.sh && docker compose up -d --build
# Les services « stub » répondent sur /health et /metrics en attendant le vrai code.
# Chaque responsable remplace le contenu de son dossier services/<nom>/ (Dockerfile + code).
name: resilience-alpha

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Durcissement de base pour les services applicatifs (retirer une ligne seulement si nécessaire, et le noter dans docs/)
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  logging: *logging
  restart: unless-stopped
  networks: [resilience-net]

networks:
  resilience-net:
    name: resilience-net

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
  loki-data:
  ollama-data:
  waf-deny:   # liste d'IP bloquées : écrite par remediation, lue par waf (B : à brancher dans la conf nginx)

services:
  # ───────────────────────── Entrée / WAF ─────────────────────────
  waf:
    image: owasp/modsecurity-crs:nginx-alpine   # B : épingler une version précise
    environment:
      BACKEND: http://front:3000
      PORT: "8080"
      MODSEC_RULE_ENGINE: "On"
      PARANOIA: "1"
    ports:
      - "80:8080"          # seul point d'entrée accessible depuis le hotspot
    volumes:
      - waf-deny:/etc/waf-deny:ro
    depends_on: [front]
    logging: *logging
    restart: unless-stopped
    networks: [resilience-net]

  # ───────────────────────── Application (A) ─────────────────────────
  front:                       # A : le front sert l'UI et proxifie /api -> api-paiement, /auth -> auth
    <<: *hardened
    build: ./services/front
    environment: { SERVICE: front, PORT: "3000" }
    depends_on: [api-paiement, auth]

  auth:
    <<: *hardened
    build: ./services/auth
    environment:
      SERVICE: auth
      PORT: "4001"
      JWT_SECRET: ${JWT_SECRET:?définir JWT_SECRET dans .env}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }

  api-paiement:
    <<: *hardened
    build: ./services/api-paiement
    environment:
      SERVICE: api-paiement
      PORT: "4000"
      AUTH_URL: http://auth:4001
      JWT_SECRET: ${JWT_SECRET:?définir JWT_SECRET dans .env}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    restart: unless-stopped
    networks: [resilience-net]

  # ───────────────────────── Remédiation (A) ─────────────────────────
  remediation:
    <<: *hardened
    build: ./services/remediation
    environment:
      SERVICE: remediation
      PORT: "5000"
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      ALLOWED_SERVICES: api-paiement,auth,front
      API_URL: http://api-paiement:4000
      AUTH_URL: http://auth:4001
    volumes:
      - waf-deny:/etc/waf-deny          # écriture de la liste d'IP bloquées
    depends_on: [docker-socket-proxy]

  dashboard:
    <<: *hardened
    build: ./services/dashboard
    environment:
      SERVICE: dashboard
      PORT: "8088"
      REMEDIATION_URL: http://remediation:5000
    ports:
      - "127.0.0.1:8088:8088"           # local au PC Hôte uniquement
    depends_on: [remediation]

  # ───────────────────────── IA (C) ─────────────────────────
  detector:
    <<: *hardened
    build: ./services/detector
    environment:
      SERVICE: detector
      PORT: "5100"
      PROMETHEUS_URL: http://prometheus:9090
      REMEDIATION_URL: http://remediation:5000
    depends_on: [prometheus]

  rag:
    <<: *hardened
    build: ./services/rag
    environment:
      SERVICE: rag
      PORT: "5200"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    volumes:
      - ./docs:/docs:ro                 # lecture seule : base documentaire du RAG

  ollama:
    image: ollama/ollama:latest         # C : épingler une version précise
    profiles: ["llm"]                   # lourd en RAM : docker compose --profile llm up -d
    volumes:
      - ollama-data:/root/.ollama
    logging: *logging
    restart: unless-stopped
    networks: [resilience-net]

  # ───────────────────────── Observabilité (B) ─────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    logging: *logging
    restart: unless-stopped
    networks: [resilience-net]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?définir GRAFANA_ADMIN_PASSWORD dans .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"           # local au PC Hôte uniquement
    depends_on: [prometheus, loki]
    logging: *logging
    restart: unless-stopped
    networks: [resilience-net]

  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    logging: *logging
    restart: unless-stopped
    networks: [resilience-net]

  promtail:
    image: grafana/promtail:3.1.1
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
    depends_on: [loki, docker-proxy-ro]
    logging: *logging
    restart: unless-stopped
    networks: [resilience-net]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    # Sous Docker Desktop/WSL2, si les noms de conteneurs n'apparaissent pas, ajouter : privileged: true (à documenter)
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    logging: *logging
    restart: unless-stopped
    networks: [resilience-net]

  # ───────────────────────── Accès Docker restreint ─────────────────────────
  # Seul `remediation` peut lister + redémarrer des conteneurs.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: "1"
      ALLOW_RESTARTS: "1"
      POST: "0"                          # aucune autre action d'écriture
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *logging
    restart: unless-stopped
    networks: [resilience-net]

  # Lecture seule, uniquement pour que promtail découvre les conteneurs et lise leurs logs.
  docker-proxy-ro:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *logging
    restart: unless-stopped
    networks: [resilience-net]