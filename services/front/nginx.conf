# Sert l'interface et redirige /api et /auth vers les services. Écoute sur 3000 (utilisateur non-root).
# IMPORTANT : les noms de services sont résolus à la volée (resolver Docker + variables) : si la remédiation
# redémarre api-paiement et que son adresse change, nginx suit sans redémarrer.
map $http_x_forwarded_for $client_xff {
  default $http_x_forwarded_for;
  ""      $remote_addr;
}

server {
  listen 3000;
  server_name _;
  server_tokens off;

  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_upstream  http://api-paiement:4000;
  set $auth_upstream http://auth:4001;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","service":"front"}';
  }

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_xff;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
  }

  location /auth/ {
    proxy_pass $auth_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_xff;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
  }

  location / {
    try_files $uri /index.html;
  }
}
